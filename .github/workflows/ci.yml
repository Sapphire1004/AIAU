name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run db:test
      - run: npx supabase db lint --local --level warning
      - name: Start Edge Functions
        run: |
          npx supabase functions serve > /tmp/aiau-functions.log 2>&1 &
          sleep 5
      - name: Integration test
        run: |
          eval "$(npx supabase status -o env)"
          SUPABASE_TEST_URL="$API_URL" SUPABASE_TEST_KEY="$PUBLISHABLE_KEY" SUPABASE_TEST_EXPECT_OPENAI_UNCONFIGURED=true npm run test:integration
      - if: always()
        run: npx supabase stop --no-backup
